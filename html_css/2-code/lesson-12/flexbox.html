<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox practice</title>
    <style>
      .flex {
        display: flex;
      }
      .mt-30 {
        margin-top: 30px;
      }
      .light-blue {
        background-color: lightblue;
      }
      .light-pink {
        background-color: lightpink;
      }
      .w-100 {
        width: 100px;
      }
      .flex-1 {
        flex: 1;
      }
      .flex-2 {
        flex: 2;
      }
      .space-between {
        justify-content: space-between;
      }
      .center {
        justify-content: center;
      }
      .align-center {
        align-items: center;
      }
      .header {
        height: 70px;
        border-width: 1px;
        border-style: solid;
        border-color: gray;
      }

      body {
        padding-bottom: 1000px;
      }
    </style>
  </head>
  <body>
    <div class="flex">
      <div class="div1 light-blue">div 1 text</div>
      <div class="div light-pink">
        div 2
        <p>text</p>
      </div>
    </div>
    <div class="flex mt-30">
      <div class="div1 light-blue w-100">100px</div>
      <div class="div2 light-pink flex-1">flex 1</div>
    </div>
    <div class="flex mt-30">
      <div class="div1 light-blue w-100">100px</div>
      <div class="div2 light-pink flex-1">flex 1</div>
      <div class="div3 light-blue flex-2">flex 2</div>
    </div>
    <div class="flex mt-30 header center">
      <div class="div1 light-blue w-100">100px</div>
      <div class="div2 light-pink w-100">100px</div>
      <div class="div3 light-blue w-100">100px</div>
    </div>
    <div class="flex mt-30 header space-between">
      <div class="div1 light-blue w-100">100px</div>
      <div class="div2 light-pink w-100">100px</div>
      <div class="div3 light-blue w-100">100px</div>
    </div>

    <div class="flex mt-30 header center align-center">
      <div class="div1 light-blue w-100">100px</div>
      <div class="div2 light-pink w-100">100px</div>
      <div class="div3 light-blue w-100">100px</div>
    </div>
    <div class="flex mt-30 header space-between align-center">
      <div class="div1 light-blue w-100">100px</div>
      <div class="div2 light-pink w-100">100px</div>
      <div class="div3 light-blue w-100">100px</div>
    </div>
  </body>
</html>
