<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>practice</title>
    <style>
      p {
        font-family: Arial;
        width: 500px;
        margin-top: 0;
        margin-bottom: 0;
      }
      .line1 {
        margin-bottom: 8px;
      }
      .twitter-name {
        font-weight: bold;
      }
      .twitter-id {
        color: gray;
      }
      .line2 {
        margin-bottom: 15px;
        line-height: 25px;
      }
      .twitter-handle {
        color: rgb(24, 152, 232);
      }
    </style>
  </head>
  <body>
    <p class="line1">
      <span class="twitter-name">freeCodeCamp.org </span
      ><span class="twitter-id">@freeCodeCamp 1h</span>
    </p>
    <p class="line2">
      As a web developer, you'll want to make your projects easy to use and
      navigate around.
    </p>
    <p class="line3">
      Here <span class="twitter-handle">@chp_it</span> outlines the top skills
      new developers should have.
    </p>
  </body>
</html>
